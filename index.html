<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Result Management System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Login Page -->
  <div id="loginPage" class="login-container">
    <div class="login-box">
      <h2>🔐 Admin Login</h2>
      <input type="text" id="loginUser" placeholder="Username" />
      <input type="password" id="loginPass" placeholder="Password" />
      <button id="loginBtn">Login</button>
      <p id="loginError" class="error"></p>
      <p class="hint">Demo: Username: <strong>admin</strong> | Password: <strong>password</strong></p>
    </div>
  </div>

  <!-- Main Application -->
  <div id="mainApp" class="hidden">
    <div class="header">
      <h1>📚 Student Result Manager</h1>
      <button id="logoutBtn" class="logout-btn">Logout</button>
    </div>

    <!-- Add/Edit Form -->
    <div class="form-container">
      <h3>Add/Edit Student Result</h3>
      <form id="resultForm">
        <input type="hidden" id="editId" />
        <div class="form-group">
          <input type="text" id="studentName" placeholder="Student Name" required />
          <input type="number" id="math" placeholder="Math (0-100)" min="0" max="100" required />
          <input type="number" id="science" placeholder="Science (0-100)" min="0" max="100" required />
          <input type="number" id="english" placeholder="English (0-100)" min="0" max="100" required />
        </div>
        <div class="button-group">
          <button type="submit" id="addBtn">➕ Add Result</button>
          <button type="button" id="cancelEdit" class="cancel-btn hidden">Cancel Edit</button>
        </div>
      </form>
    </div>

    <!-- Actions & Chart -->
    <div class="actions-container">
      <div class="search-export">
        <input type="text" id="searchBox" placeholder="🔍 Search by name..." />
        <button id="printBtn" class="export-btn">📥 Export/Print</button>
        <button id="clearAllBtn" class="clear-btn">🗑️ Clear All Data</button>
      </div>
      <div class="chart-container">
        <canvas id="performanceChart" width="400" height="150"></canvas>
      </div>
    </div>

    <!-- Results Table -->
    <div class="table-container">
      <h3>Student Results</h3>
      <table id="resultTable">
        <thead>
          <tr>
            <th onclick="sortTable('name')">Name ↕️</th>
            <th onclick="sortTable('math')">Math ↕️</th>
            <th onclick="sortTable('science')">Science ↕️</th>
            <th onclick="sortTable('english')">English ↕️</th>
            <th onclick="sortTable('total')">Total ↕️</th>
            <th onclick="sortTable('average')">Average ↕️</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr>
            <td colspan="8" class="no-data">No data added yet. Add a student result to get started!</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js"></script>
</body>
</html>
